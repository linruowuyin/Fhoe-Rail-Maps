name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 校验规则的单一真相源 = 主仓 Fhoe-Rail 的 utils/core/schema.py（纯逻辑，
      # 无第三方依赖）。地图格式升级（v1/v2 双认，docs/MAP_FORMAT.md）时这里
      # 自动跟随，不需要在两个仓库各维护一份规则。
      - name: Checkout Fhoe-Rail (validation rules source of truth)
        uses: actions/checkout@v4
        with:
          repository: linruowuyin/Fhoe-Rail
          path: fhoe
      - name: Validate maps and pictures
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          sys.path.insert(0, os.path.abspath('fhoe'))
          from utils.core.schema import validate_map

          FILE_RE = re.compile(r'^map_\d+-\d+_\d+\.json$')
          errors = []
          warnings = []
          pics = set()
          for root, _, files in os.walk('picture'):
              for f in files:
                  pics.add(f)

          def pic_exists(ref):
              # v1 键带 .png 后缀，v2 img 是 stem；磁盘实际可能是
              # `<stem>.png.webp`（源图是 webp，仓里按带后缀原名存）或 `<stem>.webp`
              base = ref[:-4] if ref.endswith('.png') else ref
              return any(base + ext in pics for ext in ('.png', '.webp', '.png.webp'))

          maps = 0
          for root, _, files in os.walk('map'):
              for f in files:
                  if not FILE_RE.match(f):
                      errors.append(f'{root}/{f}: bad filename')
                      continue
                  maps += 1
                  p = os.path.join(root, f)
                  try:
                      d = json.load(open(p, encoding='utf-8'))
                  except Exception as e:
                      errors.append(f'{p}: invalid JSON {e}')
                      continue
                  for issue in validate_map(d, filename=p):
                      (errors if issue.level == 'error' else warnings).append(
                          f'{issue.path}: {issue.message}')
                  # schema 只管结构；图片文件是否真的存在在这里查
                  for entry in d.get('start', []):
                      if not isinstance(entry, dict):
                          continue
                      for k in entry:
                          if isinstance(k, str) and k.startswith('picture\\') \
                                  and not pic_exists(k.split('\\', 1)[1]):
                              errors.append(f'{p}: missing picture {k}')
                      stem = entry.get('img')
                      if isinstance(stem, str) and stem and not pic_exists(stem):
                          errors.append(f'{p}: missing picture {stem}.png')

          print(f'checked {maps} maps, {len(pics)} pictures, {len(warnings)} warnings')
          if warnings:
              print('\n'.join(warnings[:30]))
          if errors:
              print('\n'.join(errors[:50]))
              sys.exit(1)
          print('OK')
          PY
      - name: Auto-merge on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "${{ github.event.pull_request.number }}" || true
